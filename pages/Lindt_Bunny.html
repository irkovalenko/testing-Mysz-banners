<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="chrome=1,IE=edge" />
    <title>Lindt</title>
    <style>
      html {
        height: 100%;
      }
      body {
        margin: 0;
        height: 100%;
      }
    </style>

    <meta name="viewport" content="user-scalable=yes, width=320" />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:700&subset=latin"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Montserrat:500&subset=latin"
      rel="stylesheet"
      type="text/css"
    />

    <style>
      body {
        line-height: 0;
      }
    </style>

    <script
      type="text/javascript"
      src="../resources/Lindt_Bunny/script.js"
    ></script>

    <script type="text/javascript">
      window.gotosite = function () {
        window.open("", "_blank");
      };

      window.gotomap = function () {
        var url =
          "https://www.google.com/maps/search/?api=1&query=" +
          window.nearestPlace.lat +
          "," +
          window.nearestPlace.lon;
        window.open(url, "_blank");
      };
    </script>
  </head>
  <body>
    <div
      id="lindtbunny320x480adaptivegeowithprice_hype_container"
      class="HYPE_document"
      style="
        margin: auto;
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      "
    >
      <script
        type="text/javascript"
        charset="utf-8"
        src="../resources/Lindt_Bunny/script.js"
      ></script>
    </div>

    <div style="display: none" aria-hidden="true">
      <div></div>
      <div>300 m</div>
      <div>Złota 59, 00-120 Warszawa</div>
    </div>

    <script>
      var me = {
        lat: "{lt}",
        lon: "{ln}",
      };
      var points = window.points || [];

      function getLength(p1, p2) {
        var er = 6371;
        var latDelta = ((p2.lat - p1.lat) * Math.PI) / 180;
        var lonDelta = ((p2.lon - p1.lon) * Math.PI) / 180;
        var lat1Rad = (p1.lat * Math.PI) / 180;
        var lat2Rad = (p2.lat * Math.PI) / 180;
        var a =
          Math.sin(latDelta / 2) * Math.sin(latDelta / 2) +
          Math.sin(lonDelta / 2) *
            Math.sin(lonDelta / 2) *
            Math.cos(lat1Rad) *
            Math.cos(lat2Rad);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return er * c;
      }

      function find(my) {
        var arr = [];
        for (var i = 0; i < points.length; i++) {
          var lat = parseFloat(points[i].Latitude);
          var lon = parseFloat(points[i].Longitude);

          if (isNaN(lat) || isNaN(lon)) {
            continue;
          }

          var point = {
            lat: lat,
            lon: lon,
            address: points[i].Ulica + ", " + points[i].Miasto,
          };

          var dist = getLength(my, point);
          point.dist = +dist.toFixed(1);
          arr.push(point);
        }
        return arr;
      }

      var places = find(me);
      places.sort(function (a, b) {
        return a.dist - b.dist;
      });
      window.nearestPlace = places[0];

      window.onload = function () {
        const address = document.getElementById("address");
        const geolocal = document.getElementById("distance");

        var nearestPlace = window.nearestPlace;

        if (nearestPlace && address && geolocal) {
          address.innerText = nearestPlace.address;
          let distInKm = nearestPlace.dist;

          if (typeof distInKm !== "number" || isNaN(distInKm)) {
            geolocal.innerText = ">10km";
          } else if (distInKm === 0) {
            geolocal.innerText = "0m";
          } else if (distInKm < 1) {
            geolocal.innerText = (distInKm * 1000).toFixed(0) + "m";
          } else {
            geolocal.innerText = distInKm.toFixed(1) + "km";
          }
        }
      };
    </script>
  </body>
</html>
