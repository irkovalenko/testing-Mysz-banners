<div class="profile-grid">
  <button
    class="showreel-button"
    type="button"
    aria-label="Open showreel"
    data-video="resources/showreel.mp4"
    data-title="Showreel"
    data-showreel
  >
    <video
      class="showreel-preview"
      src="resources/showreel.mp4"
      poster="resources/showreel_poster.png"
      muted
      loop
      autoplay
      playsinline
      preload="metadata"
      aria-hidden="true"
    ></video>
    <div class="showreel-button-inner">
      <div class="showreel-header">
        <span>Showreel / 01</span>
        <span>▶</span>
      </div>
    </div>
  </button>

  <article class="portrait-card">
    <a href="index.html#about" data-section="about">
      <img src="resources/profilowe.jpeg" alt="Ewa Kovalenko in Tokyo" />
      <div class="portrait-overlay">
        <div class="portrait-meta">
          <p class="portrait-name">Ewa Kovalenko</p>
          <p class="portrait-role">Motion Designer & Animator</p>
        </div>
        <span class="portrait-arrow">↓</span>
      </div>
    </a>
  </article>

  <article class="toolbox-card">
    <div class="toolbox-header">
      <span class="toolbox-label">Toolbox / 02</span>
      <span class="profile-card-icon">✦</span>
    </div>

    <div id="toolbox-grid" class="toolbox-grid"></div>
  </article>
  <article class="profile-card raster-dots">
    <div class="profile-card-header">
      <span class="profile-card-label">Profile / 03</span>
      <span class="profile-card-icon">✦</span>
    </div>

    <div class="profile-card-content">
      <h2>Making ideas<br />move.</h2>
      <p>
        I craft emotionally resonant design and animation across advertising,
        technology, film and visual identity.
      </p>
    </div>
  </article>
</div>
